name: Update README with Recent Builds

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Recent Builds
        uses: actions/github-script@v7
        with:
          script: |
            const { data: repos } = await github.rest.repos.listForUser({
              username: 'cyphalle',
              sort: 'pushed',
              per_page: 10,
              type: 'owner'
            });

            // Filter out the profile repo and forks, get top 3
            const recentRepos = repos
              .filter(repo => repo.name !== 'cyphalle' && !repo.fork && repo.description)
              .slice(0, 3);

            // Build the markdown list
            const recentBuilds = recentRepos.map(repo => {
              const desc = repo.description || 'No description';
              return `- **[${repo.name}](${repo.html_url})** — ${desc}`;
            }).join('\n');

            // Read current README
            const fs = require('fs');
            let readme = fs.readFileSync('README.md', 'utf8');

            // Replace content between markers
            const startMarker = '<!-- RECENT_BUILDS:START -->';
            const endMarker = '<!-- RECENT_BUILDS:END -->';
            const regex = new RegExp(`${startMarker}[\\s\\S]*${endMarker}`, 'g');

            const newSection = `${startMarker}\n${recentBuilds}\n${endMarker}`;
            readme = readme.replace(regex, newSection);

            // Write updated README
            fs.writeFileSync('README.md', readme);

            console.log('Updated recent builds:');
            console.log(recentBuilds);

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Update recent builds [skip ci]"
          git push
